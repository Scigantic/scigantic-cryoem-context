[package]
name = "scigantic-cryoem-context"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Enrich cryo-EM ingestion events on a Kafka bus with EMDB and EMPIAR reference context and check them against it"
repository = "https://github.com/scigantic/scigantic-cryoem-context"
readme = "README.md"
keywords = ["cryo-em", "kafka", "emdb", "empiar", "qc"]
categories = ["science"]

[lib]
name = "scigantic_cryoem_context"
path = "src/lib.rs"

[[bin]]
name = "cryoem-context-bridge"
path = "src/bin/bridge.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
moka = { version = "0.12", features = ["future"] }
rdkafka = { version = "0.37", features = ["tokio", "ssl-vendored", "libz-static"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
