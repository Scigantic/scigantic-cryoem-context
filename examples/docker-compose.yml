# A single-node Redpanda for trying the bridge locally.
#   docker compose -f examples/docker-compose.yml up -d
#   cryoem-context-bridge run --brokers localhost:9092 --dlq cryoem.ingest.dlq
#   docker compose -f examples/docker-compose.yml exec redpanda \
#       rpk topic produce cryoem.ingest -k f1 < examples/event.eer.json
#   docker compose -f examples/docker-compose.yml exec redpanda \
#       rpk topic consume cryoem.ingest.enriched -n 1
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
